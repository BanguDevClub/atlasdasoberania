<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="950" cy="315" r="320" fill="#0284c7" fill-opacity="0.07" filter="blur(60px)" />
  <circle cx="200" cy="150" r="220" fill="#f59e0b" fill-opacity="0.05" filter="blur(50px)" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="8 8">
    <line x1="80" y1="120" x2="1120" y2="120" />
    <line x1="80" y1="510" x2="1120" y2="510" />
    <line x1="160" y1="60" x2="160" y2="570" />
    <line x1="1040" y1="60" x2="1040" y2="570" />
  </g>

  <!-- Header Tag -->
  <rect x="120" y="140" width="220" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="135" y="163" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ATLAS DA SOBERANIA</text>

  <!-- Title -->
  <text x="120" y="240" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    Atlas da Soberania Industrial
  </text>
  <text x="120" y="300" fill="url(#primaryGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800">
    Vulnerabilidade e Cadeias Estratégicas
  </text>

  <!-- Subtitle -->
  <text x="120" y="360" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Diagnóstico analítico dos 8 pilares da indústria brasileira: fertilizantes, diesel, semicondutores e o nó rodoviário.
  </text>

  <!-- 8 Pillars Pills -->
  <g transform="translate(120, 410)">
    <rect x="0" y="0" width="115" height="32" rx="6" fill="#1e293b" />
    <text x="15" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Agricultura</text>

    <rect x="125" y="0" width="105" height="32" rx="6" fill="#1e293b" />
    <text x="140" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Pecuária</text>

    <rect x="240" y="0" width="95" height="32" rx="6" fill="#1e293b" />
    <text x="255" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Energia</text>

    <rect x="345" y="0" width="85" height="32" rx="6" fill="#1e293b" />
    <text x="360" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Água</text>

    <rect x="440" y="0" width="125" height="32" rx="6" fill="#1e293b" />
    <text x="455" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Combustível</text>

    <rect x="575" y="0" width="135" height="32" rx="6" fill="#1e293b" />
    <text x="590" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Indústria Civil</text>

    <rect x="720" y="0" width="150" height="32" rx="6" fill="#1e293b" />
    <text x="735" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Indústria Militar</text>

    <rect x="880" y="0" width="120" height="32" rx="6" fill="#1e293b" />
    <text x="895" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Tecnologia</text>
  </g>

  <!-- Footer Info -->
  <text x="120" y="530" fill="#64748b" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
    BanguDevClub • Código Aberto no GitHub: github.com/BanguDevClub/atlasdasoberania
  </text>
</svg>

